apis:
- aid: mlflow:mlflow-tracking-rest-api
  name: MLflow REST API
  humanURL: https://mlflow.org/docs/latest/rest-api.html
  baseURL: http://{tracking_server}/api/2.0/mlflow
  tags:
  - REST
  - Experiments
  - Runs
  - Model Registry
  - Artifacts
  description: >-
    The MLflow tracking server exposes a REST API for experiments, runs, parameters, metrics, tags, registered
    models, model versions, model aliases, and artifacts, plus newer endpoints for traces, prompts, datasets,
    and the AI gateway. POST requests use `application/json`. Pagination via `max_results` / `page_token`.
    Authentication is deployment-specific (basic auth, OIDC, or none).
  properties:
  - type: Documentation
    url: https://mlflow.org/docs/latest/rest-api.html
  - type: SDKs
    title: Python (mlflow)
    url: https://mlflow.org/docs/latest/python_api/index.html
  - type: SDKs
    title: Java
    url: https://mlflow.org/docs/latest/java_api/index.html
  - type: SDKs
    title: R
    url: https://mlflow.org/docs/latest/R-api.html
- aid: mlflow:mlflow-gateway-api
  name: MLflow AI Gateway API
  humanURL: https://mlflow.org/docs/latest/llms/gateway/index.html
  baseURL: http://{gateway}/gateway
  tags:
  - GenAI
  - LLM Gateway
  - REST
  description: >-
    The MLflow AI Gateway provides a unified HTTP interface to LLM providers with routing, rate-limiting,
    and secret management features.
  properties:
  - type: Documentation
    url: https://mlflow.org/docs/latest/llms/gateway/index.html
